<bo-loading-state *ngIf="loading"></bo-loading-state>

<div *ngIf="!loading" class="alerts-page">
  <div class="page-header">
    <div>
      <h1>Alertas de Saldo Bajo</h1>
      <p>Módulo pendiente de implementación</p>
    </div>
  </div>

  <div class="config-card">
    <div class="card-title">
      <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.268 21a2 2 0 0 0 3.464 0" />
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
      </svg>
      <h2>Módulo pendiente</h2>
    </div>

    <div class="config-content">
      <p class="state-text">
        Este módulo permitirá configurar alertas automáticas para clientes con saldo bajo.
        Queda pendiente hasta definir cola de envíos, reglas y auditoría.
      </p>
    </div>
  </div>

  <div class="history-card">
    <div class="empty-history">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v4" />
        <path d="M12 16h.01" />
      </svg>
      <p>No hay alertas registradas porque el módulo aún no está activo.</p>
    </div>
  </div>
</div>

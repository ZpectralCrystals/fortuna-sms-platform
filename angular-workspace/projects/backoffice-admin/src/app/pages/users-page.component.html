<div *ngIf="loading" class="loading-state">
  <div class="spinner"></div>
</div>

<div *ngIf="!loading" class="users-page">
  <p *ngIf="errorMessage" class="message-box">
    {{ errorMessage }}
  </p>

  <div class="toolbar">
    <div class="search-box">
      <svg
        class="search-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input
        type="text"
        name="searchTerm"
        [(ngModel)]="searchTerm"
        placeholder="Buscar usuarios..."
      />
    </div>

  </div>

  <div class="table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Empresa</th>
            <th>Teléfono</th>
            <th>Balance SMS</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of filteredUsers">
            <td>
              <div>
                <div class="user-name">{{ user.full_name || '-' }}</div>
                <div class="user-email">{{ user.email || '-' }}</div>
              </div>
            </td>
            <td class="muted-cell">{{ user.company || '-' }}</td>
            <td class="muted-cell">{{ user.phone || '-' }}</td>
            <td>
              <div class="sms-balance">
                <svg
                  class="sms-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                <span>{{ formatNumber(user.sms_balance) }}</span>
              </div>
            </td>
            <td>
              <span class="status-badge" [class.active]="user.is_active" [class.inactive]="!user.is_active">
                {{ user.is_active ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
          </tr>

          <tr *ngIf="filteredUsers.length === 0">
            <td colspan="5" class="empty-cell">
              No hay usuarios registrados
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<bo-loading-state *ngIf="loading"></bo-loading-state>

<div *ngIf="!loading" class="invoices-page">
  <div class="page-header">
    <div>
      <h1>Facturas</h1>
      <p>Módulo pendiente de implementación</p>
    </div>
  </div>

  <div class="filters-card">
    <div class="filters-title">
      <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
      </svg>
      <h2>Facturación pendiente</h2>
    </div>
    <p class="notice-message">
      Este módulo permitirá emitir y consultar comprobantes asociados a recargas aprobadas.
      Aún no hay integración de facturación productiva conectada.
    </p>
  </div>

  <div class="list-card">
    <bo-empty-state
      title="No hay facturas disponibles"
      icon="file-text"
    ></bo-empty-state>
  </div>
</div>
